<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner - GestionBoutique</title>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .header { text-align: center; color: white; margin-bottom: 10px; }
        .header h1 { font-size: 20px; font-weight: bold; }
        .header p { font-size: 12px; opacity: 0.8; }

        .status {
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
            color: white;
            font-weight: 500;
            font-size: 14px;
            background: rgba(255,255,255,0.2);
        }
        .status.connected { background: rgba(16,185,129,0.4); }
        .status.error { background: rgba(239,68,68,0.4); }
        .status.scanning { background: rgba(59,130,246,0.4); }
        .status.success { background: rgba(16,185,129,0.6); }

        .video-container {
            flex: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video { width: 100%; height: 100%; object-fit: cover; }

        .scan-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; height: 220px;
            border: 3px solid rgba(16,185,129,0.8);
            border-radius: 16px;
            pointer-events: none;
        }

        .scan-overlay::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #10b981, transparent);
            animation: scanline 2s ease-in-out infinite;
        }

        @keyframes scanline {
            0%, 100% { top: 10%; opacity: 0.3; }
            50% { top: 90%; opacity: 1; }
        }

        .video-msg {
            color: white;
            font-size: 14px;
            text-align: center;
            position: absolute;
        }

        .controls { display: flex; gap: 8px; margin-top: 10px; }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn:active { transform: scale(0.96); }
        .btn-start { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-stop { background: linear-gradient(135deg, #ef4444, #dc2626); }

        .result-card {
            background: rgba(255,255,255,0.95);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

        .result-label { font-size: 10px; color: #6b7280; }
        .result-code {
            font-size: 20px;
            font-weight: bold;
            color: #1f2937;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        .result-status { font-size: 11px; margin-top: 2px; font-weight: 500; }

        .history {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            max-height: 150px;
            overflow-y: auto;
        }
        .history-title { color: rgba(255,255,255,0.6); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .history-item {
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 12px;
        }
        .history-code { font-family: 'Courier New', monospace; }
        .history-time { opacity: 0.5; font-size: 10px; }

        .stats {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px;
            display: flex;
            justify-content: space-around;
            color: white;
            font-size: 11px;
        }
        .stat-value { font-size: 16px; font-weight: bold; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Scanner Mobile</h1>
            <p>GestionBoutique</p>
        </div>

        <div class="status" id="status">Pret</div>

        <div class="video-container">
            <video id="video" playsinline autoplay muted></video>
            <div class="scan-overlay" id="scanOverlay" style="display:none;"></div>
            <div class="video-msg" id="videoMsg">Appuyez sur Demarrer</div>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="btnToggle" onclick="toggleScanning()">Demarrer le scan</button>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-label">Dernier code</div>
            <div class="result-code" id="resultCode">-</div>
            <div class="result-status" id="resultStatus"></div>
        </div>

        <div class="history">
            <div class="history-title">Historique</div>
            <div id="historyList"></div>
        </div>

        <div class="stats">
            <div><span class="stat-value" id="scanCount">0</span><span>Scans</span></div>
            <div><span class="stat-value" id="serverStatus">OK</span><span>Serveur</span></div>
        </div>
    </div>

    <script>
        var codeReader = null;
        var scanning = false;
        var scanCount = 0;
        var lastCode = '';
        var lastCodeTime = 0;

        // URL de base = meme serveur que la page
        var baseUrl = window.location.origin;

        var video = document.getElementById('video');
        var videoMsg = document.getElementById('videoMsg');
        var scanOverlay = document.getElementById('scanOverlay');
        var statusEl = document.getElementById('status');
        var btnToggle = document.getElementById('btnToggle');
        var resultCard = document.getElementById('resultCard');
        var resultCode = document.getElementById('resultCode');
        var resultStatus = document.getElementById('resultStatus');
        var scanCountEl = document.getElementById('scanCount');
        var serverStatusEl = document.getElementById('serverStatus');
        var historyList = document.getElementById('historyList');

        // === ENVOYER CODE PAR HTTP POST ===
        function sendCode(code) {
            var now = Date.now();
            if (code === lastCode && (now - lastCodeTime) < 3000) return;
            lastCodeTime = now;
            lastCode = code;

            fetch(baseUrl + '/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code, timestamp: now })
            })
            .then(function(response) {
                if (response.ok) {
                    scanCount++;
                    scanCountEl.textContent = scanCount;
                    resultCode.textContent = code;
                    resultStatus.textContent = 'Envoye au PC';
                    resultStatus.style.color = '#10b981';
                    resultCard.style.display = 'block';
                    serverStatusEl.textContent = 'OK';

                    addToHistory(code);
                    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
                    updateStatus('Envoye : ' + code, 'success');

                    setTimeout(function() {
                        if (statusEl.className.indexOf('success') !== -1)
                            updateStatus('Scan en cours...', 'scanning');
                    }, 1500);
                } else {
                    resultStatus.textContent = 'Erreur serveur';
                    resultStatus.style.color = '#ef4444';
                }
            })
            .catch(function(err) {
                resultStatus.textContent = 'Erreur connexion';
                resultStatus.style.color = '#ef4444';
                serverStatusEl.textContent = '--';
                updateStatus('Erreur envoi', 'error');
            });
        }

        function addToHistory(code) {
            var t = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
            var el = document.createElement('div');
            el.className = 'history-item';
            el.innerHTML = '<span class="history-code">' + code + '</span><span class="history-time">' + t + '</span>';
            historyList.insertBefore(el, historyList.firstChild);
            while (historyList.children.length > 30) historyList.removeChild(historyList.lastChild);
        }

        // === SCAN VIDEO LIVE ===
        async function toggleScanning() {
            if (scanning) {
                stopScanning();
            } else {
                await startScanning();
            }
        }

        async function startScanning() {
            try {
                videoMsg.textContent = 'Demarrage camera...';

                var stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });

                video.srcObject = stream;
                video.style.display = 'block';
                videoMsg.style.display = 'none';
                scanOverlay.style.display = 'block';

                // Hints pour accélérer la détection
                var hints = new Map();
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                    ZXing.BarcodeFormat.EAN_13,
                    ZXing.BarcodeFormat.EAN_8,
                    ZXing.BarcodeFormat.CODE_128,
                    ZXing.BarcodeFormat.CODE_39,
                    ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E
                ]);
                hints.set(ZXing.DecodeHintType.TRY_HARDER, false);

                codeReader = new ZXing.BrowserMultiFormatReader(hints);

                // Réduire résolution pour analyse plus rapide (scan toutes les 250ms)
                codeReader.timeBetweenDecodingAttempts = 250;

                codeReader.decodeFromStream(stream, 'video', function(result, err) {
                    if (result) sendCode(result.text);
                });

                scanning = true;
                btnToggle.textContent = 'Arreter le scan';
                btnToggle.className = 'btn btn-stop';
                updateStatus('Scan en cours...', 'scanning');

            } catch (err) {
                videoMsg.textContent = 'Camera non disponible';
                videoMsg.style.display = 'block';
                updateStatus('Erreur camera : ' + err.message, 'error');
            }
        }

        function stopScanning() {
            if (codeReader) { codeReader.reset(); codeReader = null; }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(function(t) { t.stop(); });
                video.srcObject = null;
            }
            scanning = false;
            video.style.display = 'none';
            scanOverlay.style.display = 'none';
            videoMsg.textContent = 'Appuyez sur Demarrer';
            videoMsg.style.display = 'block';
            btnToggle.textContent = 'Demarrer le scan';
            btnToggle.className = 'btn btn-start';
            updateStatus('Pret', 'connected');
        }

        function updateStatus(msg, cls) {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + cls;
        }
    </script>
</body>
</html>
